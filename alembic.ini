# alembic.ini
#
# CONCEPT: Alembic Configuration
#
# Alembic is the database migration tool for SQLAlchemy.
# Think of it as "Git for your database schema."
#
# How migrations work:
# 1. You change a SQLAlchemy model (add a column, create a table, etc.)
# 2. Run: alembic revision --autogenerate -m "add user email column"
# 3. Alembic compares your current models to the DB schema → generates a diff
# 4. A new file appears in alembic/versions/ with UP and DOWN functions
# 5. Run: alembic upgrade head   → applies the migration to the DB
# 6. Run: alembic downgrade -1   → rolls back the last migration
#
# The [alembic] section configures where migrations live and how to connect.
# script_location: where alembic's env.py and versions/ folder live
# sqlalchemy.url: which database to connect to
#
# IMPORTANT: We use a placeholder for sqlalchemy.url here.
# The actual URL comes from our .env file, loaded in env.py.
# This is intentional: never hardcode credentials in alembic.ini.

[alembic]
# path to migration scripts
script_location = backend/database/migrations

# template used to generate migration file names
# %(rev)s = short revision hash, %(slug)s = message slug
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
timezone = UTC

# max length of characters to apply to the "Generates" field in the revision
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# version location specification; This defaults
# to alembic/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = %(here)s/backend/database/migrations/versions

# the output encoding used when revision files are written from script.mako
output_encoding = utf-8

# ── IMPORTANT: We DON'T set sqlalchemy.url here ──────────────────────────────
# The URL is loaded from environment variables in migrations/env.py.
# This prevents credentials from leaking into this config file.
# If you set it here, it overrides env.py — leave it blank.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "black" - use the exec runner, execute a binary
# hooks = black
# black.type = exec
# black.executable = %(here)s/.venv/bin/black
# black.options = REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
